<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信发件系统</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f4f7; margin: 0; padding: 24px 12px; color: #222; }
  .card { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h2 { margin: 0 0 18px; font-size: 20px; text-align: center; }
  label { display: block; font-size: 14px; margin: 12px 0 6px; color: #555; }
  input, textarea { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d5dae1; border-radius: 8px; outline: none; }
  input:focus, textarea:focus { border-color: #07c160; }
  textarea { min-height: 96px; resize: vertical; }
  button { width: 100%; margin-top: 16px; padding: 12px; font-size: 16px; color: #fff; background: #07c160; border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #9fd8b8; cursor: default; }
  button.ghost { background: #fff; color: #07c160; border: 1px solid #07c160; }
  .link { display: block; text-align: center; margin-top: 14px; font-size: 14px; color: #576b95; cursor: pointer; }
  .err { margin-top: 12px; font-size: 14px; color: #fa5151; white-space: pre-wrap; }
  .ok { margin-top: 12px; font-size: 14px; color: #07c160; word-break: break-all; }
  .hint { margin-top: 12px; font-size: 13px; color: #888; line-height: 1.6; }
  .qr { display: block; width: 240px; height: 240px; margin: 12px auto; border: 1px solid #eee; border-radius: 8px; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; background: #f6f7f9; padding: 8px; border-radius: 6px; }
  pre.out { margin-top: 12px; font-size: 12px; background: #1e1e1e; color: #d6deeb; padding: 12px; border-radius: 8px; overflow: auto; max-height: 320px; white-space: pre-wrap; word-break: break-all; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <!-- 登录 -->
  <div id="view-login">
    <h2>登录</h2>
    <label>账号（微信 user_id）</label>
    <input id="login-user" placeholder="xxx@im.wechat" autocomplete="username">
    <label>密码</label>
    <input id="login-pass" type="password" placeholder="注册时设置的密码" autocomplete="current-password">
    <button id="btn-login" onclick="doLogin()">登录</button>
    <div class="err" id="login-err"></div>
    <span class="link" onclick="showRegister()">没有账号？去注册 →</span>
  </div>

  <!-- 注册 -->
  <div id="view-register" class="hidden">
    <h2>注册</h2>
    <div id="reg-step1">
      <label>设置密码（≥6 位）</label>
      <input id="reg-pass" type="password" placeholder="登录与 API 共用此密码" autocomplete="new-password">
      <label>确认密码</label>
      <input id="reg-pass2" type="password" autocomplete="new-password">
      <button id="btn-reg-qr" onclick="regStart()">下一步：获取二维码</button>
      <div class="err" id="reg-err1"></div>
    </div>
    <div id="reg-step2" class="hidden">
      <p class="hint" style="text-align:center">用微信扫码，确认登录</p>
      <img class="qr" id="reg-qr" alt="登录二维码">
      <p class="hint" id="reg-status" style="text-align:center">等待扫码…</p>
      <div class="err" id="reg-err2"></div>
    </div>
    <span class="link" onclick="regCancel();show('view-login')">← 返回登录</span>
  </div>

  <!-- 激活：等第一条微信消息 -->
  <div id="view-activate" class="hidden">
    <h2>激活账号</h2>
    <p class="ok">你的账号：</p>
    <p class="mono" id="act-userid"></p>
    <p class="err hidden" id="act-replaced"></p>
    <p class="hint">用你的微信ClawBot发 <b>任意一条消息</b>，拿到回信凭证后即可发件。</p>
    <p class="hint" id="act-tip" style="text-align:center">正在等待…</p>
    <button id="btn-act-retry" class="hidden" onclick="fireReadyOnce()">重试</button>
    <div class="err" id="act-err"></div>
    <span class="link" onclick="actStop();show('view-login')">← 返回登录</span>
  </div>

  <!-- 发件 -->
  <div id="view-app" class="hidden">
    <h2>发件</h2>
    <p class="hint" id="app-who"></p>
    <label>消息内容</label>
    <textarea id="send-text" placeholder="输入要发送的文本" oninput="refreshCurl()"></textarea>
    <div class="row">
      <button id="btn-send" onclick="doSend()">读取+发送</button>
      <button class="ghost" onclick="doLogout()">退出</button>
    </div>
    <div class="err" id="send-err"></div>
    <button id="btn-go-activate" class="ghost hidden" style="margin-top:8px" onclick="showActivate(currentUser)">去激活 →</button>
    <pre class="out hidden" id="send-out"></pre>
    <label style="margin-top:18px">跨域直调 curl（免登录，把 YOUR_PASSWORD 换成你的密码）</label>
    <pre class="out" id="curl-out"></pre>
    <button class="ghost" style="margin-top:8px" onclick="copyCurl()">复制 curl</button>
    <p class="hint" id="curl-tip"></p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let regTimer = null;
let pollSecs = 60;
let actTimer = null;
let actAbort = null;
let currentUser = '';

function show(id) {
  ['view-login', 'view-register', 'view-activate', 'view-app'].forEach(v => $(v).classList.add('hidden'));
  $(id).classList.remove('hidden');
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = {};
  try { data = await r.json(); } catch (e) { /* 非 JSON */ }
  if (!r.ok) throw new Error(data.error || ('请求失败 ' + r.status));
  return data;
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

// ---------- 登录 ----------
async function doLogin() {
  $('login-err').textContent = '';
  $('btn-login').disabled = true;
  try {
    const d = await post('/api/login', { user_id: $('login-user').value.trim(), password: $('login-pass').value });
    localStorage.setItem('user_id', d.user_id);
    $('login-pass').value = '';
    await enterApp();
  } catch (e) { $('login-err').textContent = e.message; }
  $('btn-login').disabled = false;
}

// ---------- 注册 ----------
function showRegister() {
  actStop();
  if (regTimer) { clearInterval(regTimer); regTimer = null; }
  $('reg-step1').classList.remove('hidden');
  $('reg-step2').classList.add('hidden');
  $('reg-err1').textContent = ''; $('reg-err2').textContent = '';
  $('reg-status').textContent = '等待扫码…';
  show('view-register');
}

function regCancel() {
  if (regTimer) { clearInterval(regTimer); regTimer = null; }
  actStop();
  $('reg-step1').classList.remove('hidden');
  $('reg-step2').classList.add('hidden');
}

async function regStart() {
  $('reg-err1').textContent = '';
  const p1 = $('reg-pass').value, p2 = $('reg-pass2').value;
  if (p1.length < 6) { $('reg-err1').textContent = '密码至少 6 位'; return; }
  if (p1 !== p2) { $('reg-err1').textContent = '两次密码不一致'; return; }
  $('btn-reg-qr').disabled = true;
  try {
    const d = await post('/api/register/qr', { password: p1 });
    $('reg-qr').src = 'data:image/png;base64,' + d.qr_png;
    $('reg-step1').classList.add('hidden');
    $('reg-step2').classList.remove('hidden');
    pollRegStatus(d.qrcode, p1);
  } catch (e) { $('reg-err1').textContent = e.message; }
  $('btn-reg-qr').disabled = false;
}

async function pollRegStatus(qrcode, password) {
  const sleep = ms => new Promise(r => regTimer = setTimeout(r, ms));
  while (true) {
    let d;
    try {
      d = await api('/api/register/status?qrcode=' + encodeURIComponent(qrcode));
    } catch (e) { $('reg-err2').textContent = e.message; await sleep(2000); continue; }
    if (d.status === 'scaned') $('reg-status').textContent = '已扫码，请在手机上确认登录…';
    else if (d.status === 'expired') { $('reg-err2').textContent = '二维码已过期，请返回重来'; return; }
    else if (d.status === 'confirmed') { regFinish(password, d); return; }
    else $('reg-status').textContent = '等待扫码…';
    await sleep(2000);
  }
}

async function regFinish(password, d) {
  try {
    const r = await post('/api/register/finish', {
      password, bot_token: d.bot_token, user_id: d.user_id || '', base_url: d.base_url || ''
    });
    localStorage.setItem('user_id', r.user_id || '');
    $('reg-pass').value = ''; $('reg-pass2').value = '';
    showActivate(r.user_id, r.overwritten);
  } catch (e) { $('reg-err2').textContent = e.message; }
}

async function apiWithTimeout(path, ms) {
  const c = new AbortController();
  actAbort = c;
  const t = setTimeout(() => c.abort(), ms);
  try {
    return await api(path, { signal: c.signal });
  } finally {
    clearTimeout(t);
    if (actAbort === c) actAbort = null;
  }
}

// ---------- 激活（单长请求 + 手动重试） ----------
function showActivate(userId, overwritten) {
  actStop();
  $('act-userid').textContent = userId;
  const rep = $('act-replaced');
  if (overwritten) {
    rep.textContent = '已覆盖该微信旧绑定，请用新密码登录';
    rep.classList.remove('hidden');
  } else {
    rep.textContent = '';
    rep.classList.add('hidden');
  }
  $('act-err').textContent = '';
  $('btn-act-retry').classList.add('hidden');
  show('view-activate');
  fireReadyOnce();
}

function actStop() {
  if (actTimer) { clearInterval(actTimer); actTimer = null; }
  if (actAbort) { try { actAbort.abort(); } catch (e) {} actAbort = null; }
}

async function fireReadyOnce() {
  actStop();
  $('act-err').textContent = '';
  $('btn-act-retry').classList.add('hidden');
  let left = pollSecs;
  $('act-tip').textContent = '正在等待你的第一条微信消息…还剩 ' + left + ' 秒';
  actTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) { clearInterval(actTimer); actTimer = null; return; }
    $('act-tip').textContent = '正在等待你的第一条微信消息…还剩 ' + left + ' 秒';
  }, 1000);
  try {
    const d = await apiWithTimeout('/api/account/ready', (pollSecs + 10) * 1000);
    if (d.ready) { await enterApp(); return; }
    throw new Error('未收到微信消息，请确认已发送后重试');
  } catch (e) {
    if (actTimer) { clearInterval(actTimer); actTimer = null; }
    $('act-tip').textContent = '等待超时';
    $('act-err').textContent = (e.name === 'AbortError' ? '等待超时，请确认已发送微信消息后重试' : e.message);
    $('btn-act-retry').classList.remove('hidden');
  }
}

// ---------- 发件 ----------
async function enterApp(prefetched) {
  actStop();
  regCancelTimerOnly();
  try {
    const me = prefetched || await api('/api/me');
    if (me.poll_timeout > 0) pollSecs = me.poll_timeout;
    if (!me.ready) { showActivate(me.user_id); return; }
    currentUser = me.user_id || '';
    $('app-who').textContent = '当前账号：' + (me.user_id || '') + (me.peer ? '　WeChatClaw ID：' + me.peer : '');
    refreshCurl();
    show('view-app');
  } catch (e) { show('view-login'); }
}

function regCancelTimerOnly() {
  if (regTimer) { clearInterval(regTimer); regTimer = null; }
}

async function doSend() {
  $('send-err').textContent = '';
  $('btn-go-activate').classList.add('hidden');
  $('send-out').classList.add('hidden');
  $('btn-send').disabled = true;
  try {
    const d = await post('/api/send', { text: $('send-text').value });
    $('send-out').textContent = JSON.stringify(d, null, 2);
    $('send-out').classList.remove('hidden');
    if (!d.sent && d.error) {
      $('send-err').textContent = d.error;
      $('btn-go-activate').classList.remove('hidden');
    }
  } catch (e) { $('send-err').textContent = e.message; }
  $('btn-send').disabled = false;
}

async function doLogout() {
  try { await post('/api/logout', {}); } catch (e) {}
  $('send-text').value = '';
  currentUser = '';
  show('view-login');
}

// ---------- curl 直调 ----------
function curlCmd() {
  const t = $('send-text').value.trim() || 'hi';
  const payload = JSON.stringify({ user_id: currentUser, password: 'YOUR_PASSWORD', text: t });
  return "curl -s -X POST " + location.origin + "/api/send"
    + " -H 'Content-Type: application/json'"
    + " -d '" + payload.replace(/'/g, "'\\''") + "'";
}

function refreshCurl() {
  const el = $('curl-out');
  if (el) el.textContent = curlCmd();
}

async function copyCurl() {
  const s = curlCmd();
  const done = () => {
    $('curl-tip').textContent = '已复制到剪贴板';
    setTimeout(() => { $('curl-tip').textContent = ''; }, 2000);
  };
  try { await navigator.clipboard.writeText(s); done(); return; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = s;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { $('curl-tip').textContent = '复制失败，请手动复制'; }
  ta.remove();
}

// ---------- 入口 ----------
(function init() {
  const saved = localStorage.getItem('user_id');
  if (saved) $('login-user').value = saved;
  fetch('/api/me').then(async r => { if (r.ok) enterApp(await r.json()); });
})();
</script>
</body>
</html>
